name: Supabase production

on:
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/config.toml"
      - "scripts/configure-supabase-oauth.mjs"
      - "scripts/audit-supabase-platform.mjs"
      - ".github/workflows/supabase-production.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.SUPABASE_PRODUCTION_ENABLED == 'true' }}
    environment: production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install pinned Supabase CLI
        run: npm ci

      - name: Validate deployment configuration
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN"
          test -n "$SUPABASE_DB_PASSWORD"
          test -n "$SUPABASE_PROJECT_REF"

      - name: Enforce production platform gates before mutation
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npm run audit:production:supabase

      - name: Link production project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply reviewed migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: npx supabase db push --include-all

      - name: Configure the public OAuth metadata origin
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BUDGETIA_PUBLIC_SUPABASE_URL: https://${{ vars.SUPABASE_PROJECT_REF }}.supabase.co
        run: npx supabase secrets set BUDGETIA_PUBLIC_SUPABASE_URL="$BUDGETIA_PUBLIC_SUPABASE_URL" --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy OAuth-protected Budgetia MCP
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase functions deploy budgetia-mcp --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Deploy authenticated account deletion
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase functions deploy delete-account --project-ref "$SUPABASE_PROJECT_REF"

      - name: Deploy private BYOK financial coach
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: npx supabase functions deploy budgetia-ai-coach --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt

      - name: Configure the encrypted Coach scheduler
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        shell: bash
        run: |
          [[ "$SUPABASE_PROJECT_REF" =~ ^[a-z0-9]{20}$ ]]
          npx supabase db query --linked \
            "select public.configure_ai_coach_cron_for_worker('https://${SUPABASE_PROJECT_REF}.supabase.co');"

      - name: Configure optional Expo push security
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "$EXPO_PUSH_ACCESS_TOKEN" ]]; then
            npx supabase secrets set EXPO_ACCESS_TOKEN="$EXPO_PUSH_ACCESS_TOKEN" --project-ref "$SUPABASE_PROJECT_REF"
          else
            echo "Optional Expo push access token not configured."
          fi

      - name: Configure the OAuth server and consent URL
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          BUDGETIA_WEB_URL: ${{ vars.BUDGETIA_WEB_URL }}
        run: node scripts/configure-supabase-oauth.mjs
